# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "xt-rcar-domd-gen5"
BBFILE_PATTERN_xt-rcar-domd-gen5 := "^${LAYERDIR}/"
BBFILE_PRIORITY_xt-rcar-domd-gen5 = "10"

LAYERSERIES_COMPAT_xt-rcar-domd-gen5 = "scarthgap"

